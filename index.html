<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">

<meta property="og:url" content="https://arneandklara.wedding/">
<meta property="og:site_name" content="Klara &amp; Arne">
<meta property="og:locale" content="en_GB">
<meta property="og:image" content="https://arneandklara.wedding/assets/og.jpg?v=2">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:alt" content="Klara and Arne - save the date, 2-4 July 2027">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#23241f">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<link rel="canonical" href="https://arneandklara.wedding/">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/geist-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
<script>
  (() => {
    const supported = ['en', 'no', 'it'];
    const stored = localStorage.getItem('lang');
    const preferred = (navigator.languages || [navigator.language || 'en'])
      .map(l => l.slice(0, 2).toLowerCase())
      .find(l => supported.includes(l));
    document.documentElement.lang = supported.includes(stored) ? stored : (preferred || 'en');
  })();
</script>
</head>
<body>

<img class="photo" id="photo" alt="" hidden data-i18n-attr="alt:a11y.photo">

<nav class="langs" aria-label="Language">
  <button type="button" data-lang="en" lang="en">English</button>
  <button type="button" data-lang="no" lang="no">Norsk</button>
  <button type="button" data-lang="it" lang="it">Italiano</button>
</nav>

<main tabindex="0">

  <section class="hero" id="top">
    <p class="eyebrow" data-i18n="hero.eyebrow"></p>
    <h1>Klara &amp; Arne</h1>
    <p class="date"><time datetime="2027-07-02" data-i18n="hero.date"></time></p>
    <p class="lead" data-i18n="hero.lead"></p>
    <a class="cue" href="#weekend" data-i18n="hero.more"></a>
  </section>

  <div class="sheet">

    <section class="block" id="weekend">
      <div class="group">
        <h2 data-i18n="days.title"></h2>
        <p data-i18n="days.body"></p>
      </div>
      <div class="group">
        <h2 data-i18n="where.title"></h2>
        <p class="venue">Villa Fenicia</p>
        <p class="address">SP 86 Ruvo&#8209;Bisceglie, km 2<br>70037 Ruvo di Puglia (BA), Italia</p>
        <p class="site">
          <a href="https://www.villafenicia.com/" rel="noopener">villafenicia.com</a>
          <span class="sep" aria-hidden="true">&middot;</span>
          <a href="https://www.google.com/maps/search/?api=1&amp;query=Villa+Fenicia+Ruvo+di+Puglia"
             rel="noopener" data-i18n="where.maps"></a>
        </p>
      </div>
      <a class="next" href="#travel" data-i18n-attr="aria-label:a11y.next"></a>
    </section>

    <section class="block" id="travel">
      <div class="group">
        <h2 data-i18n="travel.title"></h2>
        <p data-i18n="travel.air"></p>
        <p data-i18n="travel.rail"></p>
        <p data-i18n="travel.car"></p>
      </div>
      <div class="group">
        <h2 data-i18n="stay.title"></h2>
        <p data-i18n="stay.body"></p>
      </div>
      <a class="next" href="#guests" data-i18n-attr="aria-label:a11y.next"></a>
    </section>

    <section class="block" id="guests">
      <div class="group">
        <h2 data-i18n="guests.title"></h2>
        <p data-i18n="guests.kids"></p>
        <p data-i18n="guests.partners"></p>
      </div>
      <div class="group">
        <h2 data-i18n="rsvp.title"></h2>
        <p data-i18n="rsvp.body"></p>
        <a class="cta" id="form" href="#" hidden target="_blank" rel="noopener"
           data-i18n="rsvp.cta"></a>
        <p class="soon" id="form-soon" data-i18n="rsvp.soon"></p>
      </div>
      <a class="next" href="#contact" data-i18n-attr="aria-label:a11y.next"></a>
    </section>

    <section class="block" id="contact">
      <div class="group">
        <h2 data-i18n="contact.title"></h2>
        <p data-i18n="contact.body"></p>
        <p class="mails">
          <a href="mailto:klarakb@hotmail.com">klarakb@hotmail.com</a><br>
          <a href="mailto:arnegiacomo@gmail.com">arnegiacomo@gmail.com</a>
        </p>
      </div>
      <footer class="foot">
        <p data-i18n="footer.note"></p>
      </footer>
    </section>

  </div>

</main>

<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
